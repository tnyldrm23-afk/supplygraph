name: supplygraph
services:
  neo4j:
    image: neo4j:5.26.12-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run make setup first}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - '127.0.0.1:7474:7474'
      - '127.0.0.1:7687:7687'
    volumes:
      - neo4j-data:/data
      - neo4j-plugins:/plugins
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
  api:
    build: .
    image: ${SUPPLYGRAPH_IMAGE:-supplygraph-api:local}
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      OLLAMA_URL: http://ollama:11434
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
  web:
    image: nginx:1.28.0-alpine
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./app/static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/api/health']
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.11.4
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  neo4j-data:
  neo4j-plugins:
  ollama-data:
