name: Quality
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: make install
      - run: make lint
      - run: make test
      - uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: reports/coverage.xml
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: make install setup
      - name: Start real graph and API services
        run: docker compose up --build -d --wait --wait-timeout 300 neo4j api web
      - run: make test-integration
      - name: Show container diagnostics
        if: always()
        run: docker compose ps && docker compose logs --tail=50
      - name: Stop containers
        if: always()
        run: docker compose down
